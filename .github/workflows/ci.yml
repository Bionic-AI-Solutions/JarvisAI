name: Jarvis AI CI/CD

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Backend Pipeline ───

  backend-type-check:
    name: Backend - TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-ai-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: jarvis-ai-backend/package-lock.json
      - run: npm ci
      - run: npm run type-check

  backend-lint:
    name: Backend - Lint
    runs-on: ubuntu-latest
    needs: backend-type-check
    defaults:
      run:
        working-directory: jarvis-ai-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: jarvis-ai-backend/package-lock.json
      - run: npm ci
      - run: npm run lint

  backend-test:
    name: Backend - Unit Tests
    runs-on: ubuntu-latest
    needs: backend-type-check
    defaults:
      run:
        working-directory: jarvis-ai-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: jarvis-ai-backend/package-lock.json
      - run: npm ci
      - run: npm test -- --ci --coverage --testPathPattern='tests/unit'
        env:
          NODE_ENV: test
          REDIS_SENTINELS: ''
          CORS_ALLOWED_ORIGINS: 'http://localhost:3000'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: jarvis-ai-backend/coverage/

  backend-build:
    name: Backend - Build
    runs-on: ubuntu-latest
    needs: [backend-test, backend-lint]
    defaults:
      run:
        working-directory: jarvis-ai-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: jarvis-ai-backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: jarvis-ai-backend/dist/

  # ─── Frontend Pipeline ───

  frontend-type-check:
    name: Frontend - TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-ai-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: jarvis-ai-frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check

  frontend-build:
    name: Frontend - Build
    runs-on: ubuntu-latest
    needs: frontend-type-check
    defaults:
      run:
        working-directory: jarvis-ai-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: jarvis-ai-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: jarvis-ai-frontend/dist/

  # ─── Docker ───

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./jarvis-ai-backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./jarvis-ai-frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy ───

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - run: echo "Deploying to staging..."

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - run: echo "Deploying to production..."
